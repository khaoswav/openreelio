name: Native macOS SwiftUI

on:
  pull_request:
    paths:
      - "native-macos/**"
      - ".github/workflows/native-macos.yml"
  push:
    branches:
      - native-macos-foundation
    paths:
      - "native-macos/**"
      - ".github/workflows/native-macos.yml"

jobs:
  swift-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Rust CLI bridge
        run: cargo build --release --manifest-path crates/openreelio-cli/Cargo.toml --bin openreelio-cli
      - name: Build SwiftUI app
        run: swift build --package-path native-macos
