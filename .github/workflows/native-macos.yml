name: Native macOS SwiftUI

on:
  pull_request:
    paths:
      - "native-macos/**"
      - "crates/openreelio-cli/**"
      - "crates/openreelio-core/**"
      - "src-tauri/src/**"
      - "scripts/build-native-macos.sh"
      - ".github/workflows/native-macos.yml"
  push:
    branches:
      - native-macos-foundation
    paths:
      - "native-macos/**"
      - "crates/openreelio-cli/**"
      - "crates/openreelio-core/**"
      - "src-tauri/src/**"
      - "scripts/build-native-macos.sh"
      - ".github/workflows/native-macos.yml"

jobs:
  swift-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build shared Rust CLI bridge
        run: cargo build --release --manifest-path crates/openreelio-cli/Cargo.toml --bin openreelio-cli --no-default-features
      - name: Build native SwiftUI app
        run: swift build --package-path native-macos
