name: Native macOS SwiftUI

on:
  pull_request:
    paths:
      - "native-macos/**"
      - ".github/workflows/native-macos.yml"
  push:
    branches:
      - native-macos-foundation
    paths:
      - "native-macos/**"
      - ".github/workflows/native-macos.yml"

jobs:
  swift-build:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Build native macOS package
        run: swift build --package-path native-macos
